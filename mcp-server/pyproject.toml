[project]
name = "acevo-mcp"
version = "0.1.0"
description = "MCP server for the AC EVO dedicated server dashboard"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2.0"]

[project.scripts]
acevo-mcp = "acevo_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["acevo_mcp.py"]
